spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SelfStorageFacilityDB;encrypt=true;trustServerCertificate=true

# LOCAL DEVELOPMENT ONLY. Override these values in every deployed environment.
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:12345}

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# LOCAL DEVELOPMENT ONLY. This public fallback is not a production secret.
# JWT_SECRET must override it in staging and production.
app.jwt.secret=${JWT_SECRET:safebox-local-development-only-signing-key-not-for-production-2026}
