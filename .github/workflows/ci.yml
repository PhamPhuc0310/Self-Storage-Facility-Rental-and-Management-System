# ---------------------------------------------------------------------
#  Mục đích: Tự động build + test project Java/Maven mỗi khi có code
#            được push lên nhánh main hoặc có Pull Request vào main.
#
#  Nội dung chính:
#   1. Cấu trúc file YAML (indent bằng SPACE, KHÔNG dùng TAB)
#   2. Các khái niệm: workflow, job, step, action, runner
#   3. Cách dùng biến môi trường ${{ ... }} của GitHub
# =====================================================================
name: Self-Storage-Facility-Rental-and-Management-System (CI included) |  © 2026 by PhamPhuc0310

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: self-storage
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: self-storage/pom.xml
      - name: Build and test
        run: bash ./mvnw --batch-mode --no-transfer-progress verify
