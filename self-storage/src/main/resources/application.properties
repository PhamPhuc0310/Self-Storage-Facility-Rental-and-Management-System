spring.application.name=self-storage

# ===============================
# SQL SERVER DATABASE
# ===============================

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=SelfStorageFacilityDB;encrypt=true;trustServerCertificate=true}

spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=3600000
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:${server.port:8080}}
app.mail.from=${MAIL_FROM:SafeBox Storage <no-reply@safebox.test>}
app.mail.demo-inbox=false
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

