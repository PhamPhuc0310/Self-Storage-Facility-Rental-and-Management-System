<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SafeBox · Quản trị truy cập</title><style>body{font:16px system-ui;background:#f4f7fb;color:#17344a;margin:0}header{background:#123b58;color:white;padding:1rem 5%}main{max-width:1100px;margin:auto;padding:2rem}a{color:#146b9a}table{width:100%;border-collapse:collapse;background:white}td,th{padding:.7rem;border-bottom:1px solid #dde6ed;text-align:left}button,input,select{padding:.5rem;border:1px solid #bccbd6;border-radius:6px}button{background:#146b9a;color:white;cursor:pointer}.row{display:flex;gap:.4rem;flex-wrap:wrap}#message{min-height:2rem}</style><script src="/auth.js"></script><script src="/js/uc12-time.js"></script><link rel="stylesheet" href="/css/safebox-shared.css"><link rel="stylesheet" href="/css/phase46-ui.css"><script src="/js/role-navigation.js" defer></script><script src="/js/support-contact.js" defer></script></head><body style="visibility:hidden"><header data-role-navigation class="sb-management-header"><a href="/role-home.html" style="color:white">← SafeBox</a> · Quản trị tài khoản và quyền truy cập</header><main><h1>Tài khoản hệ thống</h1><p>Phân quyền cơ sở cho quản lý và vùng cho nhân viên. Quyền bị thu hồi có hiệu lực ở yêu cầu kế tiếp.</p><p id="message" role="status"></p><div id="users-scroll" style="overflow:auto"><table><thead><tr><th>Tài khoản</th><th>Vai trò và trạng thái</th><th>Phạm vi hiện tại</th><th>Thao tác</th></tr></thead><tbody id="users"></tbody></table></div><h2>Lịch sử quản trị gần đây</h2><div id="audit"></div></main><script>
(async()=>{if(!await SafeBoxAuth.requireRole('SYSTEM_ADMIN'))return;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));async function api(url,method='GET',body){const r=await SafeBoxAuth.authFetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.message||'Không thể cập nhật.');return d}const roleLabels={CUSTOMER:'Khách hàng',FACILITY_STAFF:'Nhân viên cơ sở',FACILITY_MANAGER:'Quản lý cơ sở',BUSINESS_OPERATIONS_MANAGER:'Quản lý kinh doanh',SYSTEM_ADMIN:'Quản trị hệ thống'};async function load(){const [users,audit]=await Promise.all([api('/api/admin/access/users'),api('/api/admin/access/audit')]);$('audit').innerHTML=audit.map(x=>`<article>${esc(SafeBoxUc12Time.formatDateTimeVN(x.createdAt))} · Thao tác quản trị · ${esc(x.description)}</article>`).join('')||'<p>Chưa có hoạt động.</p>';
$('users').innerHTML=users.map(u=>`<tr><td>${esc(u.fullName)}<br><small>${esc(u.email)}</small></td><td>${esc(roleLabels[u.role]||u.role)} · ${u.status==='ACTIVE'?'Hoạt động':'Ngừng hoạt động'}</td><td>${esc(u.facilityIds.join(', '))}<br>${esc(u.regionCodes.join(', '))}</td><td><div class="row"><select data-role="${u.userId}">${['CUSTOMER','FACILITY_STAFF','FACILITY_MANAGER','BUSINESS_OPERATIONS_MANAGER','SYSTEM_ADMIN'].map(r=>`<option value="${r}" ${r===u.role?'selected':''}>${esc(roleLabels[r]||r)}</option>`).join('')}</select><button data-action="role" data-id="${u.userId}">Đổi vai trò</button><button data-action="status" data-id="${u.userId}">${u.status==='ACTIVE'?'Vô hiệu hóa':'Kích hoạt'}</button><input data-facility="${u.userId}" placeholder="UUID cơ sở"><button data-action="grant-facility" data-id="${u.userId}" data-business="${u.role==='BUSINESS_OPERATIONS_MANAGER'}">Cấp cơ sở</button><button data-action="revoke-facility" data-id="${u.userId}" data-business="${u.role==='BUSINESS_OPERATIONS_MANAGER'}">Thu hồi</button><input data-region="${u.userId}" placeholder="Mã vùng"><button data-action="grant-region" data-id="${u.userId}">Cấp vùng</button><button data-action="revoke-region" data-id="${u.userId}">Thu hồi</button></div></td></tr>`).join('');
$('users').onclick=async e=>{const b=e.target.closest('button[data-action]');if(!b)return;const id=b.dataset.id,action=b.dataset.action;try{let url='/api/admin/access',method='PUT',body;if(action==='role'){url+=`/users/${id}/role`;body={role:document.querySelector(`[data-role="${id}"]`).value}}else if(action==='status'){url+=`/users/${id}/status`;body={status:b.textContent==='Vô hiệu hóa'?'INACTIVE':'ACTIVE'}}else if(action.includes('facility')){const f=document.querySelector(`[data-facility="${id}"]`).value.trim();if(!/^[0-9a-f-]{36}$/i.test(f))throw Error('Nhập UUID cơ sở hợp lệ.');method=action==='grant-facility'?'POST':'DELETE';if(b.dataset.business==='true'){url=`/api/admin/report-scopes/${id}${method==='DELETE'?'/'+f:''}`;body=method==='POST'?{facilityId:f}:undefined}else{url+=`/managers/${id}/facilities/${f}`}}else{const region=document.querySelector(`[data-region="${id}"]`).value.trim();if(!/^[A-Z0-9_-]{2,30}$/.test(region))throw Error('Nhập mã vùng hợp lệ.');url+=`/staff/${id}/regions${action==='revoke-region'?'/'+region:''}`;method=action==='grant-region'?'POST':'DELETE';body=method==='POST'?{regionCode:region}:undefined}await api(url,method,body);$('message').textContent='Đã cập nhật quyền truy cập.';await load()}catch(err){$('message').textContent=err.message}};}try{await load()}catch(e){$('message').textContent=e.message}})();
</script></body></html>
