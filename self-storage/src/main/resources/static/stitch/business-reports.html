<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tổng quan kinh doanh | SafeBox</title>
<link rel="stylesheet" href="/css/safebox-shared.css"><link rel="stylesheet" href="/css/phase46-ui.css"><link rel="stylesheet" href="/css/management-workspace.css">

<body class="workspace" style="visibility:hidden"><header class="sb-header" data-role-navigation><a class="sb-brand" href="/role-home.html">SafeBox Storage</a></header>
<main class="sb-container"><div class="page-heading"><div><p class="sb-eyebrow">KHÔNG GIAN QUẢN LÝ</p><h1>Tổng quan kinh doanh</h1><p>Theo dõi khoản thu và vận hành trong phạm vi cơ sở được cấp.</p></div></div><form id="report-form" class="toolbar sb-card"><label>Từ ngày<input id="start-date" type="text" placeholder="dd/MM/yyyy" required></label><label>Đến ngày<input id="end-date" type="text" placeholder="dd/MM/yyyy" required></label><label>Cơ sở<select id="facility"><option value="">Tất cả cơ sở được cấp</option></select></label><label>Xu hướng<select id="grouping"><option value="DAY">Theo ngày</option><option value="MONTH">Theo tháng</option></select></label><button id="apply" class="sb-button" disabled>Áp dụng</button><button id="csv" type="button" class="sb-button sb-secondary" disabled>Xuất file</button></form><p id="report-state" role="status" aria-live="polite">Đang tải phạm vi báo cáo...</p><button id="retry" class="sb-button sb-secondary" hidden>Thử lại</button><section id="results" hidden><div id="kpis" class="kpis"></div><nav class="tabs" aria-label="Nhóm báo cáo"><button type="button" data-tab="overview" aria-pressed="true">Tổng quan</button><button type="button" data-tab="revenue" aria-pressed="false">Doanh thu</button><button type="button" data-tab="occupancy" aria-pressed="false">Tình trạng kho</button><button type="button" data-tab="contracts" aria-pressed="false">Hợp đồng</button><button type="button" data-tab="payments" aria-pressed="false">Thanh toán</button></nav><section id="overview"><div class="split"><article class="sb-card"><h2>Xu hướng tiền thuê đã thu</h2><div id="revenue-chart" class="chart-list"></div></article><article class="sb-card"><h2>Công suất cơ sở</h2><div id="occupancy-chart" class="chart-list"></div></article></div></section><section id="table-panel" hidden><div class="toolbar"><label>Tìm trong báo cáo<input id="report-search" type="search" placeholder="Nhập cơ sở hoặc giá trị cần tìm"></label></div><div id="report-grid"></div></section><p id="report-note" class="notice"></p></section></main>
