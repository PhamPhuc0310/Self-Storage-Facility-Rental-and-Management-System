<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hỗ trợ SafeBox</title><script src="https://cdn.tailwindcss.com"></script><script src="/auth.js"></script></head><body class="bg-slate-100 text-slate-800" style="visibility:hidden"><header class="bg-indigo-950 text-white p-4"><div class="max-w-6xl mx-auto flex justify-between"><a href="/role-home.html" class="font-bold">SafeBox · Hỗ trợ</a><button onclick="SafeBoxAuth.logout()">Đăng xuất</button></div></header><main class="max-w-6xl mx-auto p-5 space-y-5"><div><h1 class="text-2xl font-bold">Yêu cầu hỗ trợ</h1><p id="intro" class="text-slate-600"></p></div><section id="create" class="bg-white p-5 rounded-xl shadow" hidden><h2 class="font-bold mb-3">Tạo yêu cầu hỗ trợ</h2><form id="create-form" class="grid gap-3 md:grid-cols-2"><select id="contract" required class="border p-2 rounded"></select><select id="type" class="border p-2 rounded"><option value="ACCESS">Khóa / mã truy cập</option><option value="PAYMENT">Thanh toán</option><option value="UNIT_CONDITION">Tình trạng kho</option><option value="GOODS">Hàng hóa</option><option value="OTHER">Khác</option></select><input id="title" required maxlength="255" class="border p-2 rounded md:col-span-2" placeholder="Tiêu đề"><textarea id="description" required maxlength="4000" class="border p-2 rounded md:col-span-2" placeholder="Mô tả chi tiết"></textarea><select id="priority" class="border p-2 rounded"><option value="LOW">Thấp</option><option value="MEDIUM" selected>Trung bình</option><option value="HIGH">Cao</option></select><button class="bg-indigo-600 text-white rounded px-4 py-2">Gửi yêu cầu</button></form></section><p id="notice" class="text-rose-700"></p><section id="tickets" class="space-y-3"></section></main><script src="/js/support.js"></script></body></html>
