<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SafeBox · Quản lý cơ sở</title><style>body{font:16px system-ui;background:#f4f7fb;color:#17344a;margin:0}header{background:#123b58;color:white;padding:1rem 5%}main{max-width:850px;margin:auto;padding:2rem}a{color:#146b9a}form,article{background:white;border-radius:12px;padding:1.3rem;margin:1rem 0;box-shadow:0 2px 8px #123b5812}label{display:block;margin:.7rem 0}input,select{display:block;width:100%;box-sizing:border-box;padding:.6rem;border:1px solid #bccbd6;border-radius:6px}button{padding:.6rem 1rem;background:#146b9a;color:white;border:0;border-radius:6px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem}</style><script src="/auth.js"></script><link rel="stylesheet" href="/css/safebox-shared.css"><link rel="stylesheet" href="/css/phase46-ui.css"><script src="/js/role-navigation.js" defer></script><script src="/js/support-contact.js" defer></script><link rel="stylesheet" href="/css/management-workspace.css"></head><body class="workspace" style="visibility:hidden"><header data-role-navigation class="sb-management-header"><a href="/role-home.html" style="color:white">← SafeBox</a></header><main class="sb-container"><div class="page-heading"><div><p class="sb-eyebrow">QUẢN LÝ KINH DOANH</p><h1>Cơ sở lưu trữ</h1></div><button id="create-facility" class="sb-button">Thêm cơ sở</button></div><p>Tạo và cập nhật thông tin cơ sở. Cơ sở mới không có kho sẵn sàng cho đến khi quản lý cơ sở xác nhận kho và có giá hiệu lực.</p><p id="message" role="status"></p><dialog id="facility-detail" class="drawer" aria-labelledby="title"><div class="drawer-head"><h2>Thông tin cơ sở</h2><button type="button" class="sb-button sb-secondary" id="close-facility">Đóng ×</button></div><p id="form-message" role="status"></p><form id="form"><h2 id="title">Thêm cơ sở</h2><div class="grid"><label>Mã cơ sở<input id="code" pattern="[A-Z0-9_-]{3,30}" required></label><label>Mã vùng<input id="region" pattern="[A-Z0-9_-]{2,30}" required></label></div><label>Tên cơ sở<input id="name" required minlength="3"></label><label>Địa chỉ đầy đủ<input id="address" required minlength="8"></label><div class="grid"><label>Điện thoại<input id="phone"></label><label>Vĩ độ<input id="latitude" type="number" step="any"></label><label>Kinh độ<input id="longitude" type="number" step="any"></label><label>Trạng thái<select id="status"><option value="INACTIVE">Chưa hoạt động</option><option value="ACTIVE">Hoạt động</option></select></label></div><button>Lưu cơ sở</button> <button id="reset" type="button">Thêm mới</button></form></dialog><div class="toolbar"><label>Tìm cơ sở<input id="facility-search" type="search" placeholder="Tên, mã, địa chỉ hoặc vùng"></label><label>Trạng thái<select id="facility-status"><option value="">Tất cả trạng thái</option><option value="ACTIVE">Hoạt động</option><option value="INACTIVE">Chưa hoạt động</option></select></label><button id="reload" class="sb-button sb-secondary">Tải lại</button></div><section id="list" data-caption="Danh mục cơ sở kinh doanh"></section><p class="notice">Phân trang trên danh sách API đã tải. Phạm vi báo cáo được cấp riêng tại mục Báo cáo.</p></main><script src="/js/management-grid.js"></script><script>
(async()=>{if(!await SafeBoxAuth.requireRole('BUSINESS_OPERATIONS_MANAGER'))return;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));let editing=null,items=[];
const grid=SafeBoxGrid.mount($('list'),[{label:'Tên cơ sở',value:f=>f.name},{label:'Mã cơ sở',value:f=>f.facilityCode||'Chưa cấp mã'},{label:'Vùng',value:f=>f.regionCode||'Chưa cấp'},{label:'Địa chỉ',value:f=>f.address},{label:'Trạng thái',value:f=>f.status==='ACTIVE'?'Hoạt động':'Chưa hoạt động'}],{search:$('facility-search'),filter:f=>!$('facility-status').value||f.status===$('facility-status').value});
$('facility-status').onchange=()=>grid.refresh();$('create-facility').onclick=()=>edit(null);$('close-facility').onclick=()=>$('facility-detail').close();$('list').addEventListener('grid-open',e=>edit(e.detail));$('reload').onclick=()=>load().catch(err=>{$('message').textContent=err.message});
async function api(url,options){const r=await SafeBoxAuth.authFetch(url,options);const d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.message||'Không thể lưu cơ sở.');return d}function edit(f){editing=f;$('title').textContent=f?'Cập nhật cơ sở':'Thêm cơ sở';$('code').disabled=!!f;for(const [id,key] of [['code','facilityCode'],['region','regionCode'],['name','name'],['address','address'],['phone','phone'],['latitude','latitude'],['longitude','longitude'],['status','status']])$(id).value=f?.[key]??(id==='status'?'INACTIVE':'');$('form-message').textContent='';if(!$('facility-detail').open)$('facility-detail').showModal()}async function load(){$('message').textContent='Đang tải cơ sở...';$('reload').disabled=true;try{items=await api('/api/business/facilities');grid.set(items);$('message').textContent='Đã tải '+items.length+' cơ sở.'}catch(e){grid.set([]);throw e}finally{$('reload').disabled=false}}
$('reset').onclick=()=>edit(null);$('form').onsubmit=async e=>{e.preventDefault();const payload={facilityCode:$('code').value.trim(),regionCode:$('region').value.trim(),name:$('name').value.trim(),address:$('address').value.trim(),phone:$('phone').value.trim(),latitude:$('latitude').value?Number($('latitude').value):null,longitude:$('longitude').value?Number($('longitude').value):null,status:$('status').value};try{$('form').querySelectorAll('button').forEach(b=>b.disabled=true);await api('/api/business/facilities'+(editing?'/'+editing.facilityId:''),{method:editing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});$('message').textContent='Đã lưu cơ sở.';$('facility-detail').close();await load()}catch(err){if($('facility-detail').open)$('form-message').textContent=err.message;else $('message').textContent='Đã lưu cơ sở nhưng chưa tải lại được danh sách. Hãy chọn Tải lại.'}finally{$('form').querySelectorAll('button').forEach(b=>b.disabled=false)}};try{await load()}catch(err){$('message').textContent=err.message}})();
</script></body></html>
