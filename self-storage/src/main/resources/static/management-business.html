<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SafeBox · Quản lý cơ sở</title><style>body{font:16px system-ui;background:#f4f7fb;color:#17344a;margin:0}header{background:#123b58;color:white;padding:1rem 5%}main{max-width:850px;margin:auto;padding:2rem}a{color:#146b9a}form,article{background:white;border-radius:12px;padding:1.3rem;margin:1rem 0;box-shadow:0 2px 8px #123b5812}label{display:block;margin:.7rem 0}input,select{display:block;width:100%;box-sizing:border-box;padding:.6rem;border:1px solid #bccbd6;border-radius:6px}button{padding:.6rem 1rem;background:#146b9a;color:white;border:0;border-radius:6px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem}</style><script src="/auth.js"></script><link rel="stylesheet" href="/css/safebox-shared.css"><link rel="stylesheet" href="/css/phase46-ui.css"><script src="/js/role-navigation.js" defer></script><script src="/js/support-contact.js" defer></script></head><body style="visibility:hidden"><header data-role-navigation class="sb-management-header"><a href="/role-home.html" style="color:white">← SafeBox</a> · Quản lý cơ sở kinh doanh</header><main><h1>Cơ sở lưu trữ</h1><p>Tạo và cập nhật thông tin cơ sở. Cơ sở mới không có kho sẵn sàng cho đến khi quản lý cơ sở xác nhận kho và có giá hiệu lực.</p><p id="message" role="status"></p><form id="form"><h2 id="title">Thêm cơ sở</h2><div class="grid"><label>Mã cơ sở<input id="code" pattern="[A-Z0-9_-]{3,30}" required></label><label>Mã vùng<input id="region" pattern="[A-Z0-9_-]{2,30}" required></label></div><label>Tên cơ sở<input id="name" required minlength="3"></label><label>Địa chỉ đầy đủ<input id="address" required minlength="8"></label><div class="grid"><label>Điện thoại<input id="phone"></label><label>Vĩ độ<input id="latitude" type="number" step="any"></label><label>Kinh độ<input id="longitude" type="number" step="any"></label><label>Trạng thái<select id="status"><option value="INACTIVE">Chưa hoạt động</option><option value="ACTIVE">Hoạt động</option></select></label></div><button>Lưu cơ sở</button> <button id="reset" type="button">Thêm mới</button></form><section id="list"></section></main><script>
(async()=>{if(!await SafeBoxAuth.requireRole('BUSINESS_OPERATIONS_MANAGER'))return;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));let editing=null,items=[];async function api(url,options){const r=await SafeBoxAuth.authFetch(url,options);const d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.message||'Không thể lưu cơ sở.');return d}function edit(f){editing=f;$('title').textContent=f?'Cập nhật cơ sở':'Thêm cơ sở';$('code').disabled=!!f;for(const [id,key] of [['code','facilityCode'],['region','regionCode'],['name','name'],['address','address'],['phone','phone'],['latitude','latitude'],['longitude','longitude'],['status','status']])$(id).value=f?.[key]??(id==='status'?'INACTIVE':'');scrollTo({top:0,behavior:'smooth'})}async function load(){items=await api('/api/business/facilities');$('list').innerHTML=items.map(f=>`<article><strong>${esc(f.name)}</strong> · ${esc(f.facilityCode||'chưa cấp mã')} · ${esc(f.status)}<p>${esc(f.address)} · Vùng ${esc(f.regionCode||'chưa cấp')}</p><button type="button" data-id="${f.facilityId}">Cập nhật</button></article>`).join('')||'<p>Chưa có cơ sở.</p>'}$('list').addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(b)edit(items.find(f=>f.facilityId===b.dataset.id))});$('reset').onclick=()=>edit(null);$('form').onsubmit=async e=>{e.preventDefault();const payload={facilityCode:$('code').value.trim(),regionCode:$('region').value.trim(),name:$('name').value.trim(),address:$('address').value.trim(),phone:$('phone').value.trim(),latitude:$('latitude').value?Number($('latitude').value):null,longitude:$('longitude').value?Number($('longitude').value):null,status:$('status').value};try{await api('/api/business/facilities'+(editing?'/'+editing.facilityId:''),{method:editing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});$('message').textContent='Đã lưu cơ sở.';edit(null);await load()}catch(err){$('message').textContent=err.message}};try{await load()}catch(err){$('message').textContent=err.message}})();
</script></body></html>
