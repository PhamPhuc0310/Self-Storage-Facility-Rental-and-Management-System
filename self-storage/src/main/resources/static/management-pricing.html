<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SafeBox · Bảng giá thuê</title><style>body{font:16px system-ui;background:#f4f7fb;color:#17344a;margin:0}header{background:#123b58;color:white;padding:1rem 5%}main{max-width:950px;margin:auto;padding:2rem}a{color:#146b9a}form,article{background:white;border-radius:12px;padding:1.3rem;margin:1rem 0;box-shadow:0 2px 8px #123b5812}label{display:block;margin:.7rem 0}input,select,textarea{display:block;width:100%;box-sizing:border-box;padding:.6rem;border:1px solid #bccbd6;border-radius:6px}button{padding:.6rem 1rem;background:#146b9a;color:white;border:0;border-radius:6px;cursor:pointer;margin:.25rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem}.muted{color:#536b7b}</style><script src="/auth.js"></script><link rel="stylesheet" href="/css/safebox-shared.css"><link rel="stylesheet" href="/css/phase46-ui.css"><script src="/js/role-navigation.js" defer></script><script src="/js/support-contact.js" defer></script><script src="/js/uc12-time.js"></script></head><body style="visibility:hidden"><header data-role-navigation class="sb-management-header"><a href="/role-home.html" style="color:white">← SafeBox</a> · Quản lý bảng giá thuê</header><main><h1>Bảng giá theo thời gian hiệu lực</h1><p>Giá mới chỉ áp dụng cho lần đặt kho theo ngày bắt đầu thuê. Giá đã chốt trong hợp đồng không đổi.</p><p id="message" role="status"></p><label>Cơ sở<select id="facility"></select></label><form id="form"><h2 id="form-title">Tạo bản nháp giá thuê</h2><div class="grid"><label>Loại kho<select id="type" required></select></label><label>Giá thuê mỗi tháng (đ)<input id="price" type="number" min="1" step="0.01" required></label><label>Hiệu lực từ ngày<input id="from" type="date" required></label><label>Hiệu lực đến ngày (tùy chọn)<input id="to" type="date"></label></div><label id="reason-wrap" hidden>Lý do đề xuất<textarea id="reason" minlength="10" maxlength="500"></textarea></label><button id="submit">Lưu bản nháp</button></form><h2>Lịch sử bảng giá</h2><section id="prices"></section><h2>Đề xuất điều chỉnh</h2><section id="proposals"></section></main><script>
(async()=>{const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const me=await SafeBoxAuth.currentUser?.()||await (await SafeBoxAuth.authFetch('/api/auth/me')).json();const business=me.role==='BUSINESS_OPERATIONS_MANAGER',manager=me.role==='FACILITY_MANAGER';if(!business&&!manager){location.href='/role-home.html';return}document.body.style.visibility='visible';$('form-title').textContent=business?'Tạo bản nháp giá thuê':'Đề xuất điều chỉnh giá';$('submit').textContent=business?'Lưu bản nháp':'Gửi đề xuất';$('reason-wrap').hidden=business;async function api(url,options){const r=await SafeBoxAuth.authFetch(url,options),d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.message||'Không thể xử lý yêu cầu.');return d}const base=business?'/api/business':'/api/manager';let editing=null;let facilities=await api(base+'/facilities');$('facility').innerHTML=facilities.map(f=>`<option value="${f.facilityId}">${esc(f.name)}</option>`).join('');async function load(){const id=$('facility').value;if(!id)return;const [prices,proposals,types]=await Promise.all([api(base+'/facilities/'+id+'/prices'),api(base+'/facilities/'+id+'/price-proposals'),business?api('/api/business/unit-types'):api('/api/manager/facilities/'+id+'/unit-types')]);$('type').innerHTML=types.filter(t=>t.status==='ACTIVE').map(t=>`<option value="${t.typeId}">${esc(t.typeName)}</option>`).join('');$('prices').innerHTML=prices.map(p=>`<article><strong>Loại ${p.typeId} · ${Number(p.monthlyPrice).toLocaleString('vi-VN')} đ/tháng</strong><p>${esc(SafeBoxUc12Time.formatDateVN(p.effectiveFrom))} → ${esc(p.effectiveTo?SafeBoxUc12Time.formatDateVN(p.effectiveTo):'không giới hạn')} · ${esc(p.status)}</p>${business&&p.status==='DRAFT'?`<button data-price="${p.pricingId}" data-action="edit" data-type="${p.typeId}" data-amount="${p.monthlyPrice}" data-from="${p.effectiveFrom}" data-to="${p.effectiveTo||''}">Sửa bản nháp</button><button data-price="${p.pricingId}" data-action="activate">Kích hoạt</button>`:''}${business&&p.status==='ACTIVE'?`<button data-price="${p.pricingId}" data-action="retire">Ngừng áp dụng</button>`:''}</article>`).join('')||'<p class="muted">Chưa có bảng giá.</p>';$('proposals').innerHTML=proposals.map(p=>`<article><strong>Loại ${p.typeId} · ${Number(p.proposedMonthlyPrice).toLocaleString('vi-VN')} đ/tháng</strong><p>${esc(SafeBoxUc12Time.formatDateVN(p.effectiveFrom))} → ${esc(p.effectiveTo?SafeBoxUc12Time.formatDateVN(p.effectiveTo):'không giới hạn')} · ${esc(p.status)}</p><p>${esc(p.reason)}</p>${business&&p.status==='SUBMITTED'?`<button data-proposal="${p.proposalId}" data-action="apply">Áp dụng</button><button data-proposal="${p.proposalId}" data-action="reject">Từ chối</button>`:''}</article>`).join('')||'<p class="muted">Chưa có đề xuất.</p>'} $('facility').onchange=()=>load().catch(e=>$('message').textContent=e.message);$('form').onsubmit=async e=>{e.preventDefault();const id=$('facility').value,schedule={typeId:Number($('type').value),monthlyPrice:Number($('price').value),effectiveFrom:$('from').value,effectiveTo:$('to').value||null};try{await api(base+'/facilities/'+id+(business?'/prices'+(editing?'/'+editing:''):'/price-proposals'),{method:business&&editing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(business?schedule:{schedule,reason:$('reason').value})});$('message').textContent=business?'Đã lưu bản nháp.':'Đã gửi đề xuất.';editing=null;$('form-title').textContent=business?'Tạo bản nháp giá thuê':'Đề xuất điều chỉnh giá';await load()}catch(err){$('message').textContent=err.message}};document.addEventListener('click',async e=>{const b=e.target.closest('button[data-action]');if(!b)return;if(b.dataset.action==='edit'){editing=b.dataset.price;$('type').value=b.dataset.type;$('price').value=b.dataset.amount;$('from').value=b.dataset.from;$('to').value=b.dataset.to;$('form-title').textContent='Sửa bản nháp giá thuê';scrollTo({top:0,behavior:'smooth'});return}try{let url=b.dataset.price?`/api/business/facilities/${$('facility').value}/prices/${b.dataset.price}/${b.dataset.action}`:`/api/business/price-proposals/${b.dataset.proposal}/${b.dataset.action}`;await api(url,{method:'POST'});$('message').textContent='Đã xử lý.';await load()}catch(err){$('message').textContent=err.message}});try{await load()}catch(err){$('message').textContent=err.message}})();
</script></body></html>
