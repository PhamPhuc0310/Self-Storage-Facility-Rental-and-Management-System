<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tìm kho lưu trữ | SafeBox</title><link rel="stylesheet" href="/css/safebox-shared.css"><script src="/auth.js"></script><link rel="stylesheet" href="/css/phase46-ui.css"><script src="/js/support-contact.js" defer></script></head>
<body><header class="sb-header"><a class="sb-brand" href="/">SafeBox</a><nav class="sb-nav" aria-label="Điều hướng"></nav></header>
<main class="sb-container"><section class="sb-hero"><p class="sb-eyebrow">KHO LƯU TRỮ SAFEBOX</p><h1>Tìm không gian phù hợp</h1><p>Xem thể tích và nguồn đo của từng ô, giá thuê có hiệu lực và khả năng đặt kho.</p></section>
<form id="filters" class="sb-card sb-grid" aria-label="Bộ lọc kho"><label>Cơ sở<select id="facility"><option value="">Tất cả cơ sở</option></select></label><label>Loại kho<select id="type"><option value="">Tất cả loại kho</option></select></label><label>Thể tích từ (m³)<input id="min-volume" type="number" min="0" step="0.001"></label><label>Thể tích đến (m³)<input id="max-volume" type="number" min="0" step="0.001"></label><label>Giá từ (đ/tháng)<input id="min-price" type="number" min="0" step="1"></label><label>Giá đến (đ/tháng)<input id="max-price" type="number" min="0" step="1"></label><label>Tình trạng<select id="availability"><option value="">Tất cả</option><option value="BOOKABLE">Còn trống</option><option value="HELD">Đang giữ chỗ</option><option value="OCCUPIED">Đang cho thuê</option><option value="MAINTENANCE">Đang bảo trì</option><option value="NOT_OPEN">Chưa mở cho thuê</option></select></label><label>Ngày bắt đầu thuê<input id="start-date" type="text" placeholder="dd/MM/yyyy" inputmode="numeric" required></label><label>Số tháng thuê<input id="months" type="number" min="1" max="36" value="1" required></label><button class="sb-button" type="submit">Tìm kho</button></form>
<p id="message" role="status" aria-live="polite"></p><section id="results" class="sb-cards" aria-label="Kho phù hợp"></section></main>
<dialog id="reservation-dialog" class="sb-dialog"><form id="reservation-form"><h2>Gửi yêu cầu đặt kho</h2><p id="reservation-summary"></p><p>Yêu cầu sẽ được quản lý cơ sở xác nhận. Giá và tiền cọc được chốt theo quy trình hiện hành.</p><p id="reservation-message" role="alert"></p><div class="sb-actions"><button type="button" id="close-dialog" class="sb-button sb-secondary">Quay lại</button><button class="sb-button" type="submit">Gửi yêu cầu</button></div></form></dialog>
<script src="/js/role-navigation.js"></script><script src="/js/uc12-time.js"></script><script src="/js/storage-discovery.js"></script></body></html>
